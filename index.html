  .switch{position:relative;width:40px;height:23px;flex-shrink:0;}

  .trash-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:3px 5px;line-height:1;border-radius:6px;opacity:0.55;}

  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid #EEE1E3;border-radius:10px;overflow:hidden;width:fit-content;}

    cursor:pointer;color:var(--crimson);

  input.pct-input{

    text-align:center;font-size:14.5px;font-weight:800;font-family:inherit;color:var(--ink);

        <div class="cost-rupee">

    });

    costListEl2.querySelectorAll('[data-act="toggle"]').forEach(el=>{
      el.addEventListener('change', ()=>{ setById(el.dataset.id, {enabled: el.checked}); });
    });
    costListEl2.querySelectorAll('[data-act="remove"]').forEach(el=>{
      el.addEventListener('click', ()=>{ costs = costs.filter(c=>c.id!==el.dataset.id); renderCosts(); updateSummary(); });
    });
    costListEl2.querySelectorAll('[data-act="pct"]').forEach(el=>{
      el.addEventListener('input', ()=>{ setById(el.dataset.id, {pct: clampPct(el.value)}); });
    });
    costListEl2.querySelectorAll('[data-act="inc"]').forEach(el=>{
      el.addEventListener('click', ()=>{ bump(el.dataset.id, 1); });
    });
    costListEl2.querySelectorAll('[data-act="dec"]').forEach(el=>{
      el.addEventListener('click', ()=>{ bump(el.dataset.id, -1); });
    });
  }

  function bump(id, delta){
    const c = costs.find(x=>x.id===id);
    if(!c) return;
    c.pct = clampPct(c.pct + delta);
    renderCosts();
    updateSummary();
  }

  function setById(id, patch){
    const c = costs.find(x=>x.id===id);
    if(!c) return;
    Object.assign(c, patch);
    renderCosts();
    updateSummary();
  }

  function updateSummary(){
    price = clampPct2(parseFloat(priceEl2.value)) ;
    const totalPct = costs.filter(c=>c.enabled).reduce((s,c)=>s+c.pct,0);
    const totalRupee = price * (totalPct/100);
    const netPct = 100 - totalPct;
    const netRupee = price - totalRupee;

  }
  addCustomBtn.addEventListener('click', ()=>{ customFormEl.classList.add('show'); customNameEl.focus(); });
  customCancelBtn.addEventListener('click', ()=>{ customFormEl.classList.remove('show'); customNameEl.value=''; customPctEl.value=''; });
  customAddBtn.addEventListener('click', ()=>{
    const name = customNameEl.value.trim();
    const pct = clampPct(customPctEl.value || 0);
    if(!name) return;
    costs.push({id:'custom_'+(seq++)+'_'+Date.now(), name, pct, enabled:true});
    customNameEl.value=''; customPctEl.value='';
    customFormEl.classList.remove('show');
    renderCosts(); updateSummary();
  });

  renderCosts();
  updateSummary();

  return { getState: ()=>({price, costs}) };
}

/* ---------------- Instantiate calculators ---------------- */
createCalculator(document.getElementById('calc1-root'), {
  defaultPrice: 300,
  priceHint: 'e.g. Paneer Butter Masala — the price your customer pays on the app.',
  showPreset: true,
  layout: 'sidebar',
  defaultCosts: [
    {id:'raw',   name:'Raw Material Cost',           pct:25, enabled:true},
    {id:'comm',  name:'Zomato Commission',            pct:25, enabled:true},
    {id:'ads',   name:'Zomato Ads Spend',              pct:10, enabled:true},
    {id:'disc',  name:'Zomato Platform Discounts',     pct:10, enabled:true},
    {id:'gst',   name:'GST / Taxes',                    pct:5,  enabled:true},
    {id:'labor', name:'Labor & Payroll Costs',          pct:25, enabled:true},
    {id:'rent',  name:'Rent & Utilities (Overheads)',   pct:15, enabled:true},
  ]
});

let dineState = null, zomatoState = null;
function refreshDelta(){
  const deltaVal = document.getElementById('deltaVal');
  const deltaMsg = document.getElementById('deltaMsg');
  if(!dineState || !zomatoState){ return; }
  const diff = zomatoState.netRupee - dineState.netRupee;
  deltaVal.textContent = (diff>=0?'+':'') + rupee(diff);
  deltaVal.classList.toggle('loss', diff < 0);
  deltaMsg.textContent = diff >= 0
    ? 'Taking this dish onto Zomato adds pure incremental profit per plate on top of your dine-in business.'
    : 'At current settings, the Zomato version of this dish is less profitable than dine-in — revisit commission, ads or discount %.';
}

createCalculator(document.getElementById('calc2-root'), {
  defaultPrice: 300,
  priceLabel: 'Dine-in menu price',
  priceHint: 'The price on your physical dine-in menu.',
  showPreset: false,
  layout: 'stack',
  onChange: (s)=>{ dineState = s; refreshDelta(); },
  defaultCosts: [
    {id:'d_rent',  name:'Rent & Electricity',      pct:15, enabled:true},
    {id:'d_staff', name:'Staff & Salaries',        pct:25, enabled:true},
    {id:'d_raw',   name:'Raw Food Ingredients',    pct:25, enabled:true},
    {id:'d_pack',  name:'Packaging Material',      pct:0,  enabled:true},
    {id:'d_comm',  name:'Zomato Commission',       pct:0,  enabled:true},
    {id:'d_mkt',   name:'Marketing & Discounts',   pct:2,  enabled:true},
  ]
});
